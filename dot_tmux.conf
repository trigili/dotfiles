set -g default-terminal "screen-256color"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Move the current window to the lowest unused index in this session.
bind-key g move-window -t :

# Swap the current pane with the marked pane, then clear the mark.
bind-key S swap-pane \; select-pane -M
